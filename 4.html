<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - TechMart E-Commerce Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f9; color: #1f2937; line-height: 1.5; }
    header { background-color: #111827; color: #ffffff; padding: 16px 24px; position: sticky; top: 0; z-index: 100; }
    .nav-wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-size: 20px; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; }
    .nav-links a { color: #e5e7eb; text-decoration: none; }
    .nav-links a:hover, .nav-links a.active { color: #38bdf8; font-weight: bold; }
    .cart-link { background-color: #0284c7; color: #ffffff; text-decoration: none; padding: 9px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; }
    .cart-link:hover { background-color: #0369a1; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 18px; }
    .hero { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #ffffff; padding: 26px 24px; border-radius: 10px; margin-bottom: 22px; }
    .hero h1 { font-size: 26px; margin-bottom: 6px; }
    .hero p { color: #dbeafe; font-size: 14px; }
    .box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; max-width: 600px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .submit-btn { background-color: #16a34a; color: #ffffff; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .submit-btn:hover { background-color: #15803d; }
    .msg { margin-top: 12px; font-size: 14px; font-weight: bold; color: #15803d; }
    footer { text-align: center; padding: 24px 16px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <a href="index.html" class="brand">TechMart</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="2.html">Products</a>
        <a href="3.html">About</a>
        <a href="4.html" class="active">Contact</a>
      </nav>
      <a href="index.html#cart-section" class="cart-link">
        Cart (<span id="cart-count">0</span>)
      </a>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Contact TechMart Support</h1>
      <p>Have a question about products or demo orders? Send a message below.</p>
    </section>

    <section class="box">
      <form onsubmit="handleSubmit(event)">
        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" required placeholder="Enter your name" />
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" rows="4" required placeholder="How can we help?"></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
      <div class="msg" id="form-msg"></div>
    </section>
  </main>

  <footer>
    TechMart Storefront &bull; Hosted on GitHub Pages
  </footer>

  <script>
    const cart = JSON.parse(localStorage.getItem("techmart_cart") || "[]");
    document.getElementById("cart-count").textContent = cart.reduce((s, i) => s + i.qty, 0);

    function handleSubmit(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      document.getElementById("form-msg").textContent = `Thanks ${name}! Your message has been recorded.`;
      e.target.reset();
    }
  </script>
</body>
</html>
